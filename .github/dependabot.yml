# Keeps GitHub Actions in .github/workflows/ up to date.
# This repo is a translation patch (no code deps) — github-actions is the only
# ecosystem worth tracking (actions/checkout, softprops/action-gh-release, …).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
    # Notify HetCreep on every bump PR (assignment fires a "participating" event
    # regardless of watch level). Patch/minor auto-merge after actionlint passes
    # (see dependabot-auto-merge.yml); major always waits for a human.
    assignees:
      - "HetCreep"
