name: Dependabot auto-merge

# Auto-merge Dependabot github-actions PATCH/MINOR bumps for dependabot[bot] ONLY,
# after actionlint passes on the changed workflow file. This repo has NO branch
# ruleset gating checks (owner = PeterkleCG; this token is push:true admin:false,
# cannot create one) -- so unlike a ruleset-gated setup, the gate here is an
# in-workflow job dependency (auto-merge `needs: validate`), which GitHub enforces
# within a single workflow run regardless of branch protection. MAJOR bumps are
# never auto-merged (a human reviews the breaking change). A red actionlint leaves
# the PR open (dependabot.yml `assignees` then notifies the maintainer). Only
# dependabot[bot] reaches either job, so a human-opened PR never auto-merges.
on: pull_request

permissions:
  contents: read

# Grouped per-PR (not per-ref): two different Dependabot PRs must not serialize
# behind each other. cancel-in-progress is safe here -- `gh pr merge --auto` only
# enables a flag GitHub's own merge machinery acts on, so a cancelled run leaves
# nothing half-applied; the next push to the same PR simply re-enables it.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  auto-merge:
    needs: validate
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge (patch/minor)
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --squash --auto "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
